name: PR Review Loop

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numéro de la PR (ex: 1)'
        required: false
        type: string
        default: ''
      mode:
        description: 'Mode d exécution (summary ou fix)'
        required: true
        default: 'summary'
        type: choice
        options:
          - summary
          - fix

concurrency:
  group: review-loop-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  review-loop:
    uses: instructeur22/pr-review-fetcher/.github/workflows/review-loop.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      pr_number: ${{ inputs.pr_number || '' }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
